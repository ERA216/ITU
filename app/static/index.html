<!DOCTYPE html>
<html lang="ru" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чистый счёт</title>
<style>
  /* Цвета и формы как в приложении bcc.kz: светло-серый фон, белые карточки, зелёный акцент. */
  :root { --bg:#f5f5fa; --card:#fff; --ink:#1d1d1e; --ink2:#3a3a3b; --muted:#7f8085; --line:#e7e7eb; --fill:#f0f0f4;
          --brand:#00ab75; --brand-ink:#00875c; --brand-bg:#e6f7f0;
          --warn:#c62828; --warn-bg:#fdeeee; --amber:#6b4a00; --amber-bg:#fff5df; --blue:#1f3a8a; --blue-bg:#eef2fd;
          --ok:#00875c; --ok-bg:#e6f7f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.45 "Roboto Flex", Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
         -webkit-font-smoothing:antialiased; }
  .phone { max-width:420px; margin:0 auto; min-height:100vh; padding:12px 16px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 0 10px; }
  header b { font-size:20px; font-weight:700; letter-spacing:-.01em; color:var(--ink); white-space:nowrap; }
  select, input, button { font:inherit; color:inherit; }
  select, input { width:100%; padding:12px 14px; border:1px solid transparent; border-radius:12px; background:var(--fill); }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--brand); background:#fff; }
  header select { width:auto; max-width:62%; padding:8px 12px; font-size:14px; font-weight:500; background:#fff; border-radius:20px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; }
  .balance { font-size:32px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:2px 0; }
  .muted { color:var(--muted); font-size:14px; }
  h2 { font-size:18px; font-weight:700; margin:0 0 12px; letter-spacing:-.01em; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  button { border:0; border-radius:12px; padding:13px 16px; font-weight:500; cursor:pointer; width:100%; }
  .primary { background:var(--brand); color:#fff; margin-top:14px; }
  .primary:hover { background:#009d6b; }
  .ghost { background:transparent; color:var(--muted); font-weight:500; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; padding-top:4px; }
  .amt { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  .in { color:var(--ok); }
  .tag { display:inline-block; font-size:12px; font-weight:500; padding:2px 8px; border-radius:6px; background:var(--fill); color:var(--muted); }
  .tag.held { background:var(--warn-bg); color:var(--warn); }
  .note { border-radius:12px; padding:12px 14px; font-size:14px; margin-top:12px; }
  .note.ok { background:var(--ok-bg); color:var(--ok); }
  .note.err { background:var(--warn-bg); color:var(--warn); }
  .overlay { position:fixed; inset:0; background:rgba(29,29,30,.45); display:none; align-items:flex-end; justify-content:center; }
  .overlay.show { display:flex; }
  .sheet { background:#fff; width:100%; max-width:420px; border-radius:24px 24px 0 0; padding:10px 16px 16px; max-height:92vh; overflow:auto; }
  .sheet::before { content:""; display:block; width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px; }
  .sheet h2 { font-size:20px; color:var(--ink); }
  .sheet ul { padding-left:20px; margin:10px 0; }
  .sheet li { margin:6px 0; }
  .sheet .ghost { margin-top:4px; padding:11px 16px; }
  .law { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 14px; font-size:14px; margin:12px 0; }
  .blocked h2 { font-size:18px; margin-top:4px; }
  .status { display:inline-block; font-size:12px; font-weight:500; padding:3px 10px; border-radius:6px;
            background:var(--warn-bg); color:var(--warn); margin-bottom:8px; }
  .status.review { background:var(--amber-bg); color:var(--amber); }
  .status.done { background:var(--ok-bg); color:var(--ok); }
  .doc { background:var(--fill); border-radius:12px; padding:10px 12px; margin-top:8px; font-size:14px; }
  .doc b { display:block; font-weight:500; }
  .doc input { border:0; padding:6px 0 0; background:none; }
  .doc .have { color:var(--ok); }
  textarea { width:100%; min-height:96px; padding:12px 14px; border:1px solid transparent; border-radius:12px; background:var(--fill);
             font:inherit; color:inherit; resize:vertical; }
  details { margin-top:10px; font-size:14px; }
  summary { cursor:pointer; color:var(--brand-ink); font-weight:500; }
  [hidden] { display:none !important; }
  button.link { width:auto; padding:0 4px; background:none; color:var(--brand-ink); font-weight:500; }
  button:disabled { opacity:.55; cursor:default; }
  .alert { background:var(--amber-bg); color:var(--amber); border-radius:16px; padding:16px; margin-bottom:12px; }
  .alert.hot { background:var(--warn-bg); color:var(--warn); }
  .alert h2 { color:inherit; font-size:17px; margin-bottom:6px; }
  .alert p { margin:6px 0; font-size:15px; }
  .alert .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .alert .actions button { flex:1 1 150px; margin:0; }
  .soft { background:rgba(29,29,30,.06); color:inherit; }
  .card .soft, .demo .soft { background:var(--fill); color:var(--ink); }
  .tag.warn { background:var(--amber-bg); color:var(--amber); }
  .confirm { margin-top:6px; font-size:14px; }
  .confirm button { width:auto; padding:7px 12px; font-size:14px; margin:6px 6px 0 0; }
  .langs { display:flex; gap:2px; background:var(--line); border-radius:20px; padding:3px; }
  .langs button { width:auto; padding:5px 12px; font-size:13px; font-weight:500; border-radius:16px; background:none; color:var(--muted); }
  .langs button[aria-pressed="true"] { background:var(--ink2); color:#fff; }
  .demo { border:1px dashed #d8d8dd; border-radius:16px; padding:14px; margin-top:4px; }
  .demo button { margin-top:8px; }
  .alert.call { background:var(--warn); color:#fff; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 14px; }
  .top a { font-size:14px; color:var(--muted) !important; text-decoration:none; }
  .alert.guard { background:var(--blue-bg); color:var(--blue); }
  .alert.recruit { background:var(--warn-bg); color:var(--warn); }
  .alert ul { margin:6px 0; padding-left:20px; font-size:14px; }
  .cert { background:var(--ok-bg); color:var(--ok); }
  .cert h2 { color:inherit; }
  a.btn { display:block; text-align:center; text-decoration:none; border-radius:12px; padding:13px 16px; font-weight:500;
          background:var(--brand); color:#fff; margin-top:10px; }
  .guardian select { margin-top:6px; }
  .alert.cool { background:var(--amber-bg); color:var(--amber); }
  .msgres { border-radius:12px; padding:12px 14px; margin-top:12px; font-size:15px; }
  .msgres h3 { margin:0 0 6px; font-size:16px; }
  .msgres.danger { background:var(--warn-bg); color:var(--warn); }
  .msgres.caution { background:var(--amber-bg); color:var(--amber); }
  .msgres.none { background:var(--ok-bg); color:var(--ok); }
  .msgres ol, .msgres ul { margin:6px 0; padding-left:20px; }
  .msgres .hit { background:rgba(0,0,0,.08); border-radius:4px; padding:0 4px; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { width:auto; padding:7px 12px; font-size:13px; margin:0; border-radius:20px; }
  .alert.done { background:var(--ok-bg); color:var(--ok); }
  .opt { display:flex; gap:10px; align-items:flex-start; color:var(--ink); font-size:15px; background:var(--fill);
         border:1px solid transparent; border-radius:12px; padding:12px; margin:8px 0; cursor:pointer; }
  .opt:has(input:checked) { border-color:var(--brand); background:#fff; }
  .opt input { width:auto; margin-top:4px; flex:none; accent-color:var(--brand); }
  .opt .muted { display:block; }
  .refund { background:var(--ok-bg); color:var(--ink); border-radius:12px; padding:12px 14px; margin:12px 0; font-size:14px; }
  .refund button { margin-top:10px; }
  /* Раскладка: слева подсказки для показа, справа телефон с экраном клиента. */
  body { background:#e9e9ef; }
  .app { display:flex; gap:32px; justify-content:center; align-items:flex-start; padding:24px; min-height:100vh; }
  .demo-panel { width:330px; flex:none; position:sticky; top:24px; }
  .demo-toggle { display:none; }
  .demo-body { background:#fff; border-radius:20px; padding:20px; }
  .demo-title { font-size:20px; font-weight:700; margin-bottom:4px; }
  .demo-body .muted { font-size:13px; }
  .demo-body p { margin:4px 0 0; }
  .hint { background:var(--brand-bg); color:#00563a; border-radius:12px; padding:12px 14px; font-size:14px; margin:10px 0 0; }
  .demo-sec { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; }
  .demo-links { display:flex; flex-wrap:wrap; gap:6px 16px; border-top:1px solid var(--line); margin-top:16px; padding-top:14px; }
  .demo-links a { color:var(--brand-ink); font-size:14px; font-weight:500; text-decoration:none; }
  .device { position:relative; width:400px; flex:none; height:min(860px, calc(100vh - 48px)); background:var(--bg);
            border-radius:40px; box-shadow:0 0 0 10px #1d1d1e, 0 24px 60px rgba(0,0,0,.22); overflow:hidden;
            display:flex; flex-direction:column; }
  .screen { flex:1; overflow-y:auto; padding:18px 16px 24px; scrollbar-width:none; }
  .screen::-webkit-scrollbar { display:none; }
  .hello { display:flex; align-items:center; gap:12px; padding:0 0 14px; }
  .avatar { width:42px; height:42px; flex:none; border-radius:50%; background:var(--brand-bg); color:var(--brand-ink);
            display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
  .hello .who { flex:1; min-width:0; line-height:1.25; }
  .hello .who .muted { font-size:13px; }
  .hello .who b { display:block; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hero { padding:18px 16px 16px; }
  .hero .balance { font-size:34px; }
  .quick { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:16px; }
  .quick button { background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:6px;
                  font-size:12px; font-weight:500; color:var(--ink); line-height:1.2; }
  .quick .ic { width:48px; height:48px; border-radius:14px; background:var(--brand-bg); color:var(--brand-ink);
               display:flex; align-items:center; justify-content:center; }
  .quick button:hover .ic { background:#d5f1e6; }
  svg.i { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tabbar { display:flex; background:#fff; border-top:1px solid var(--line); padding:6px 6px 12px; flex:none; }
  .tabbar button { flex:1; background:none; padding:6px 0 0; display:flex; flex-direction:column; align-items:center; gap:3px;
                   font-size:11px; font-weight:500; color:var(--muted); border-radius:0; }
  .tabbar button[aria-current="true"] { color:var(--brand-ink); }
  .toast { position:absolute; left:12px; right:12px; bottom:76px; z-index:5; pointer-events:none; }
  .toast .note { margin:0; box-shadow:0 8px 24px rgba(0,0,0,.14); pointer-events:auto; cursor:pointer; }
  .toast .note.ok { background:#1d1d1e; color:#fff; }
  .toast .note.err { background:#fff; color:var(--warn); border:1px solid #f6caca; }
  .overlay { position:absolute; z-index:10; }
  .sheet { max-width:none; }
  .row { align-items:flex-start; }
  .row .ico { width:36px; height:36px; flex:none; border-radius:50%; background:var(--fill); color:var(--muted);
              display:flex; align-items:center; justify-content:center; }
  .row .ico.in { background:var(--brand-bg); color:var(--brand-ink); }
  .row .ico svg.i { width:18px; height:18px; }
  .row .body { flex:1; min-width:0; }
  .row .body .tag { margin-top:4px; }
  .pane-title { font-size:22px; font-weight:700; margin:2px 0 14px; }
  @media (max-width:860px) {
    body { background:var(--bg); }
    .app { display:block; padding:0; }
    .demo-panel { width:auto; position:static; padding:10px 12px 0; }
    .demo-toggle { display:flex; justify-content:space-between; align-items:center; width:100%; background:#1d1d1e; color:#fff;
                   border-radius:12px; padding:11px 14px; font-size:14px; }
    .demo-toggle::after { content:"▾"; }
    .demo-panel.open .demo-toggle::after { content:"▴"; }
    .demo-body { display:none; margin-top:8px; }
    .demo-panel.open .demo-body { display:block; }
    .device { width:auto; height:calc(100dvh - 64px); border-radius:0; box-shadow:none; margin-top:10px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="demo-panel" id="demoPanel">
    <button class="demo-toggle" id="demoToggle" data-t="demoToggle"></button>
    <div class="demo-body">
      <div class="demo-title" data-t="demoTitle"></div>
      <p class="muted" data-t="demoIntro"></p>
      <label for="who" data-t="who"></label>
      <select id="who"></select>
      <p class="hint" id="personaHint"></p>
      <div class="demo-sec">
        <div class="muted" data-t="demoH"></div>
        <button class="soft" id="callToggle"></button>
      </div>
      <div class="demo-sec">
        <div class="muted" data-t="demoMsgH"></div>
        <div class="examples" style="margin-top:8px">
          <button class="soft" data-example="mistaken" data-t="exMistaken"></button>
          <button class="soft" data-example="safe" data-t="exSafe"></button>
          <button class="soft" data-example="invest" data-t="exInvest"></button>
          <button class="soft" data-example="job" data-t="exJob"></button>
        </div>
      </div>
      <nav class="demo-links"><a href="/analyst" data-t="analystLink"></a><a href="/analyst/stats" data-t="statsLink"></a></nav>
    </div>
  </aside>

  <div class="device">
    <div class="screen" id="screen">
      <header class="hello">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div class="who"><div class="muted" data-t="hello"></div><b id="meName"></b></div>
        <div class="langs" role="group" aria-label="Тіл / Язык">
          <button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button>
        </div>
      </header>

      <section data-pane="home">
        <div class="card hero">
          <div class="muted" data-t="available"></div>
          <div class="balance" id="balance">…</div>
          <div class="muted" id="heldLine"></div>
          <div class="quick">
            <button data-go="pay"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h14"/><path d="m14 4 4 4-4 4"/><path d="M20 16H6"/><path d="m10 12-4 4 4 4"/></svg></span><span data-t="qaPay"></span></button>
            <button data-go="safe" data-focus="msgCard"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8"/><path d="M8 12h5"/></svg></span><span data-t="qaMsg"></span></button>
            <button data-go="safe" data-focus="guardianCard"><span class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-5 5.5-5s4.9 2 5.5 5"/><path d="M16 4.8a3.2 3.2 0 0 1 0 6.4"/><path d="M18 14.3c1.5.7 2.6 2.3 2.9 4.7"/></svg></span><span data-t="qaGuard"></span></button>
          </div>
        </div>

        <div id="callAlert"></div>
        <div id="coolAlerts"></div>
        <div id="guardAlerts"></div>
        <div id="alerts"></div>
        <div id="compCards"></div>
        <div class="card cert" id="certCard" hidden></div>
        <div class="card blocked" id="blockCard" hidden></div>

        <div class="card">
          <h2 data-t="opsH"></h2>
          <div id="feed"></div>
        </div>
      </section>

      <section data-pane="pay" hidden>
        <div class="pane-title" data-t="transferH"></div>
        <div class="card" id="transferCard">
          <label for="to" data-t="to" style="margin-top:0"></label>
          <select id="to"></select>
          <div id="recipientNote"></div>
          <label for="amount" data-t="amount"></label>
          <input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="0">
          <button class="primary" id="send" data-t="send"></button>
        </div>
        <div class="card muted" id="payBlocked" data-t="payBlocked" hidden></div>
      </section>

      <section data-pane="safe" hidden>
        <div class="pane-title" data-t="tabSafe"></div>
        <div class="card" id="msgCard">
          <h2 data-t="msgH"></h2>
          <label for="msgText" data-t="msgLabel" style="margin-top:0"></label>
          <textarea id="msgText" maxlength="4000"></textarea>
          <button class="primary" id="msgCheck" data-t="msgCheck"></button>
          <div id="msgResult"></div>
        </div>
        <div class="card guardian" id="guardianCard"></div>
        <div class="card" id="selfCard" hidden></div>
      </section>
    </div>

    <div class="toast" id="note" aria-live="polite"></div>

    <nav class="tabbar">
      <button data-go="home" aria-current="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span data-t="tabHome"></span></button>
      <button data-go="pay"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h14"/><path d="m14 4 4 4-4 4"/><path d="M20 16H6"/><path d="m10 12-4 4 4 4"/></svg><span data-t="tabPay"></span></button>
      <button data-go="safe"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.2 3 7.6 7 9 4-1.4 7-4.8 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span data-t="tabSafe"></span></button>
    </nav>

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="stopTitle">
      <div class="sheet">
        <h2 id="stopTitle" data-t="stopTitle"></h2>
        <p id="stopText"></p>
        <ul id="reasons"></ul>
        <p id="stopGuardian" class="muted"></p>
        <div class="law" id="law" data-t="law"></div>
        <button class="primary" id="ret"></button>
        <button class="primary" id="withdraw" data-t="withdraw"></button>
        <button class="ghost" id="insist" data-t="insist"></button>
        <button class="ghost" id="later" data-t="later"></button>
      </div>
    </div>
  </div>
</div>

<script>
// Тексты экрана на русском и казахском. Казахский стоит вычитать носителю языка перед показом.
const T = {
  app: ['Чистый счёт', 'Таза шот'],
  hello: ['Здравствуйте,', 'Сәлеметсіз бе,'],
  tabHome: ['Главная', 'Басты бет'],
  tabPay: ['Переводы', 'Аударымдар'],
  tabSafe: ['Защита', 'Қорғау'],
  qaPay: ['Перевести', 'Аудару'],
  qaMsg: ['Проверить сообщение', 'Хабарламаны тексеру'],
  qaGuard: ['Доверенное лицо', 'Сенімді адам'],
  payBlocked: ['Пока операции по счёту приостановлены, переводы недоступны. Что делать, написано на главной.',
               'Шот бойынша операциялар тоқтатылған кезде аударым жасау мүмкін емес. Не істеу керегі басты бетте жазылған.'],
  demoToggle: ['Демо: кем войти и что попробовать', 'Демо: кім ретінде кіріп, не істеп көру'],
  demoTitle: ['Демо-режим', 'Демо-режим'],
  demoIntro: ['Прототип для хакатона. Выберите персонажа и следуйте подсказке: экран клиента работает как приложение банка.',
              'Хакатонға арналған прототип. Кейіпкерді таңдап, кеңесті орындаңыз: клиент экраны банк қосымшасы сияқты жұмыс істейді.'],
  statsLink: ['Эффективность системы', 'Жүйенің тиімділігі'],
  hint_1001: ['20 минут назад пришло 150 000 ₸ от незнакомца. Попробуйте переслать их на «Карту для возврата» во вкладке «Переводы» или вернуть отправителю с главной.',
              '20 минут бұрын бейтаныс адамнан 150 000 ₸ келді. Оны «Аударымдар» бөлімінде «қайтаруға арналған картаға» жіберіп көріңіз немесе басты беттен жіберушіге қайтарыңыз.'],
  hint_1002: ['Отправил Айдане 150 000 ₸. В операциях можно нажать «Это были мошенники?» у этого перевода.',

function applyStatic() {
  document.documentElement.lang = L === 'kk' ? 'kk' : 'ru';
  document.title = tr('app');
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = tr(n.dataset.t));
  $('who').setAttribute('aria-label', tr('who'));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === L)));
}

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(typeof data.detail === 'string' ? data.detail : tr('requestError')); e.status = r.status; throw e; }
  return data;
}

let noteTimer = null;
function note(text, kind) {
  clearTimeout(noteTimer);
  $('note').innerHTML = text ? `<div class="note ${kind}" role="status">${esc(text)}</div>` : '';
  if (text) noteTimer = setTimeout(() => { $('note').innerHTML = ''; }, kind === 'err' ? 9000 : 6000);
}
$('note').onclick = () => note('');
const when = s => new Date(s).toLocaleString(L === 'kk' ? 'kk-KZ' : 'ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});

// Вкладки внизу экрана: главная, переводы, защита.
function showTab(name, focus) {
  document.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== name);
  document.querySelectorAll('.tabbar [data-go]').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === name)));
  const el = focus && $(focus);
  if (el && !el.hidden) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  else $('screen').scrollTo({top: 0});
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => showTab(b.dataset.go, b.dataset.focus));
$('demoToggle').onclick = () => $('demoPanel').classList.toggle('open');

// Шапка экрана и подсказка в демо-панели для выбранного персонажа.
function renderMe() {
  const p = people.find(x => x.id === me);
  if (!p) return;
  const name = p.name.split(' (')[0];
  $('meName').textContent = name;
  $('avatar').textContent = (name.replace(/[«»"]/g, '').trim()[0] || '?').toUpperCase();
  $('personaHint').textContent = T['hint_' + me] ? tr('hint_' + me) : '';
  $('personaHint').hidden = !T['hint_' + me];
}

// Демо-вход: выбор персонажа открывает сессию этого клиента на сервере.
async function loginAs(id) {
  await api('/login', {role: 'client', client_id: id});
  me = id; $('who').value = id;
  renderMe();
}

async function loadPeople() {
  people = await api('/demo/clients');
  $('who').innerHTML = people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  if (me) $('who').value = me;
  renderMe();
}

  const bnote = (t, k) => $('blockCard').querySelector('#blockNote').innerHTML = `<div class="note ${k}">${esc(t)}</div>`;
  $('blockCard').querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      if (f.size > 5 * 1024 * 1024) throw new Error(tr('fileTooBig'));
      const b64 = await new Promise((ok, bad) => { const r = new FileReader();
        r.onload = () => ok(r.result.split(',')[1]); r.onerror = bad; r.readAsDataURL(f); });
      await api(`/cases/${appeal.case_id}/documents`, {kind: inp.dataset.kind, filename: f.name, content_base64: b64});
      await loadBlock();
    } catch (e) { bnote(e.message, 'err'); }
  });
  const rbtn = $('blockCard').querySelector('#refundBtn');
  if (rbtn) rbtn.onclick = async () => {
    rbtn.disabled = true;
    try { const r = await api(`/cases/${appeal.case_id}/refund`, {}); await load(); bnote(tr('refundOk', {m: money(r.amount)}), 'ok'); }
    catch (e) { bnote(e.message, 'err'); }
  };
  const btn = $('blockCard').querySelector('#submitAppeal');
  if (btn) btn.onclick = async () => {
    try { await api(`/cases/${appeal.case_id}/submit`, {explanation: $('expl').value}); await loadBlock(); }
    catch (e) { bnote(e.message, 'err'); }
  };
}

// Что стало с переводом, который система остановила.
function heldTag(t) {
  if (!t.case_id) return {held: ['held', tr('tagPaused')], cancelled: ['', tr('tagCancelled')],
                          pending: ['warn', tr('tagPending', {t: hm(t.release_at)})]}[t.status] || null;
  return ({
    open: ['held', tr('tagOpen')],
    asked: ['held', tr('tagGuardianWait')],
    under_review: ['held', tr('tagReview')],
    returned: ['', tr('tagReturnedCase')],
    cancelled: ['held', tr('tagCancelledBank')],
    released: ['', tr('tagReleased')],
    withdrawn: ['', tr('tagWithdrawn')],
    guardian_cancelled: ['', tr('tagGuardianCancelled')],
  })[t.case_status === 'open' && t.guardian_state === 'asked' ? 'asked' : t.case_status] || (t.status === 'cancelled' ? ['', tr('tagCancelled')] : null);
}

async function load() {
  let c;
  try { c = await api('/clients/' + me); }
  catch (e) { if (e.status !== 401 && e.status !== 403) throw e; await loginAs(me); c = await api('/clients/' + me); }
  serverNow = c.now;
  $('balance').textContent = money(c.available);
  $('heldLine').textContent = [c.held ? tr('heldLine', {m: money(c.held)}) : '', c.frozen ? tr('frozenLine', {m: money(c.frozen)}) : ''].filter(Boolean).join(' ');
  renderCall(c.call);
  // blocked: счёт закрыт целиком. limited: заморожена только спорная сумма, переводы знакомым работают.
  const blocked = c.status === 'blocked', restricted = blocked || c.status === 'limited';
  $('blockCard').hidden = !restricted; $('transferCard').hidden = blocked; $('payBlocked').hidden = !blocked;
  if (restricted) await loadBlock();
  else {
    // Если блокировку только что сняли, говорим об этом клиенту.
    const last = await api(`/clients/${me}/case`).catch(() => null);
    renderCert(last && last.status === 'unblocked' ? last.certificate : null);
    if (last && last.status === 'unblocked' && !(last.certificate && last.certificate.valid) && !$('note').innerHTML)
      note(tr('unblocked'), 'ok');
  }
  if (restricted) renderCert(null);
  renderComplaints(c.complaints || []);
  renderSelf(c.self_report, c.status);
  renderGuardRequests(c.guardian_requests || []);
  renderCooling(c.cooling || [], c.guardian_cooling || []);
  loadGuardian();
  const chosen = $('to').value;
  $('to').innerHTML = people.filter(p => p.id !== me).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  if (chosen) $('to').value = chosen;
  checkRecipient();
  renderAlerts(blocked ? [] : c.feed, c.recruit);   // пока счёт приостановлен, вернуть деньги самому нельзя
  $('feed').innerHTML = c.feed.map(t => {
    const incoming = t.direction === 'in';
    const title = t.refund ? tr('refundTitle') : t.return_of ? tr('returnTitle') : (incoming ? tr('from', {who: t.sender}) : tr('toWho', {who: t.receiver}));
    let tag = incoming ? null : heldTag(t);
    if (incoming && t.warning) tag = ['warn', tr('tagMaybeForeign')];
    if (incoming && t.returned) tag = ['', tr('tagReturnedIn')];
    if (!incoming && t.complained) tag = ['warn', tr('tagReported')];
    const open = !incoming && t.case_status === 'open' ? ` <button class="link" data-case="${t.case_id}">${tr('decide')}</button>` : '';
    const answer = !incoming && t.decision_comment ? `<div class="muted">${tr('bankAnswer')} ${esc(t.decision_comment)}</div>` : '';
    const report = !incoming && t.can_complain && !t.complained
      ? `<div><button class="link" data-report="${t.id}" style="padding:0;font-weight:500;color:var(--muted)">${tr('reportQ')}</button></div>` : '';
    return `<div class="row"><span class="ico ${incoming ? 'in' : ''}">${incoming ? ARROW_IN : ARROW_OUT}</span>
            <div class="body">${esc(title)}${open}
            <div class="muted">${esc(when(t.created_at))}</div>${tag ? `<span class="tag ${tag[0]}">${esc(tag[1])}</span>` : ''}${answer}${report}</div>
            <div class="amt ${incoming ? 'in' : ''}">${incoming ? '+' : '−'}${money(t.amount)}</div></div>`;
  }).join('') || `<div class="muted">${tr('noOps')}</div>`;
  $('feed').querySelectorAll('button[data-case]').forEach(b => b.onclick = async () => showStop(await api('/cases/' + b.dataset.case)));
  $('feed').querySelectorAll('button[data-report]').forEach(b => b.onclick = () => askReport(b));
}

// Предупреждение приходит вместе с деньгами, а не в момент, когда мошенник уже просит их переслать.
function renderAlerts(feed, recruit) {
  // Если похоже на вербовку, показываем одну общую карточку вместо предупреждения по каждому переводу.
  const skip = new Set(recruit ? recruit.incoming_ids : []);
  const items = feed.filter(t => t.direction === 'in' && t.warning && !skip.has(t.id));
  $('alerts').innerHTML = (recruit ? `
    <div class="alert recruit">
      <h2>${tr('recruitH')}</h2>
      <p>${esc(tr('recruitText', {n: recruit.senders, m: money(recruit.amount)}))}</p>
      <p>${tr('recruitScheme')}</p>
      <div class="actions">
        <button class="primary" id="recruitReturn">${esc(tr('recruitReturn', {m: money(recruit.amount)}))}</button>
        <button class="soft" id="recruitKnown">${tr('recruitKnown')}</button>
      </div>
      <p style="font-size:14px">${tr('recruitAfter')}</p>
    </div>` : '') + items.map(t => `
    <div class="alert ${t.complained ? 'hot' : ''}">
      <h2>${tr(t.complained ? 'alertHotH' : 'alertH')}</h2>
      <p>${esc(tr('alertFrom', {m: money(t.amount), who: t.sender}))} ${tr(t.complained ? 'alertHot' : 'alertNew')}</p>
      ${t.complained ? '' : `<p>${tr('alertScheme')}</p>`}
      <div class="actions">
        <button class="primary" data-return="${t.id}">${esc(tr('ret', {m: money(t.amount)}))}</button>
        ${t.complained ? '' : `<button class="soft" data-known="${t.id}">${tr('known')}</button>`}
      </div>
    </div>`).join('');
  $('alerts').querySelectorAll('[data-return]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api(`/incoming/${b.dataset.return}/return`, {}); note(tr('returnedOk', {m: money(r.amount)}), 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();
  });
  if (recruit) {
    $('recruitReturn').onclick = async () => {
      $('recruitReturn').disabled = true;
      try { const r = await api('/recruit/return-all', {}); note(tr('recruitReturned', {m: money(r.amount)}), 'ok'); }
      catch (e) { note(e.message, 'err'); }
      load();
    };
    $('recruitKnown').onclick = async () => {
      try { await api('/recruit/dismiss', {}); note(tr('recruitKnownOk'), 'ok'); } catch (e) { note(e.message, 'err'); }
      load();
    };
  }
  $('alerts').querySelectorAll('[data-known]').forEach(b => b.onclick = async () => {
    await api(`/incoming/${b.dataset.known}/known`, {}).catch(e => note(e.message, 'err'));
    note(tr('knownOk'), 'ok');
    load();
  });
}

// Что стало с обращением о мошенничестве: где деньги пострадавшего и сколько ему уже вернули.
function renderComplaints(items) {
  $('compCards').innerHTML = items.map(p => `
    <div class="alert ${p.stage === 'returned' ? 'done' : p.stage === 'closed' ? 'hot' : ''}">
      <h2>${tr('compH')}</h2>
      <p>${esc(tr('compLine', {m: money(p.amount), r: p.receiver}))}</p>
      <p><b>${esc(p.text)}</b></p>
    </div>`).join('');
}

// «Меня втянули в схему»: клиент сам рассказывает банку и получает подтверждение с датой.
let selfKey = '', selfMsg = '';
function renderSelf(rep, status) {
  const key = JSON.stringify([me, L, rep, status, selfMsg]);
  if (key === selfKey) return;           // форма не перерисовывается, пока клиент её заполняет
  selfKey = key;
  const box = $('selfCard');
  box.hidden = !rep && status !== 'active';
  let html = `<h2>${tr('srH')}</h2>`;
  if (selfMsg) html += `<div class="note ok" style="margin:0 0 12px">${esc(selfMsg)}</div>`;
  if (rep) {
    const d = new Date(rep.at).toLocaleString(L === 'kk' ? 'kk-KZ' : 'ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
    html += `<p><b>${esc(tr('srDoneH', {d}))}</b></p><p class="muted">${esc(tr('srDoneText', {n: rep.number}))}</p>
      <a class="btn" href="/clients/${me}/self-report" target="_blank" rel="noopener">${tr('srDocOpen')}</a>`;
  }
  if (status === 'active') {
    const opt = (v, t, h) => `<label class="opt"><input type="radio" name="srKind" value="${v}"><span><b>${tr(t)}</b><span class="muted">${tr(h)}</span></span></label>`;
    html += `<p class="muted"${rep ? ' style="margin-top:14px"' : ''}>${tr('srAbout')}</p>
      <button class="soft" id="srOpen">${tr('srOpen')}</button>
      <div id="srForm" hidden>
        ${opt('card', 'srCard', 'srCardHint')}${opt('transit', 'srTransit', 'srTransitHint')}${opt('offer', 'srOffer', 'srOfferHint')}
        <label for="srText">${tr('srDetails')}</label>
        <textarea id="srText" maxlength="2000" placeholder="${esc(tr('srPh'))}"></textarea>
        <p class="muted">${tr('srLaw')}</p>
        <button class="primary" id="srSend">${tr('srSend')}</button>
        <div id="srNote"></div>
      </div>`;
  }
  box.innerHTML = html;
  if (!$('srOpen')) return;
  $('srOpen').onclick = () => { $('srForm').hidden = false; $('srOpen').hidden = true; };
  $('srSend').onclick = async () => {
    const kind = (box.querySelector('input[name=srKind]:checked') || {}).value;
    const err = t => $('srNote').innerHTML = `<div class="note err">${esc(t)}</div>`;
    if (!kind) return err(tr('srPick'));
    $('srSend').disabled = true;
    try {
      const r = await api('/self-report', {kind, details: $('srText').value});
      selfMsg = r.text; await load();
      $('selfCard').scrollIntoView({behavior: 'smooth', block: 'start'});
    } catch (e) { err(e.message); $('srSend').disabled = false; }
  };
}

// Справка о снятии ограничений: её можно открыть, распечатать и показать в другом банке.
function renderCert(cert) {
  $('certCard').hidden = !(cert && cert.valid);
  if (!cert || !cert.valid) return;
  $('certCard').innerHTML = `<h2>${tr('certH')}</h2><p>${esc(tr('certText', {n: cert.number, c: cert.code}))}</p>
    <a class="btn" href="/clients/${me}/certificate" target="_blank" rel="noopener">${tr('certOpen')}</a>`;
}

// Экран доверенного лица: остановленные переводы близкого человека.
function renderGuardRequests(items) {
  $('guardAlerts').innerHTML = items.map(g => `
    <div class="alert guard">
      <h2>${esc(tr('guardH', {w: g.ward}))}</h2>
      <p>${esc(tr('guardText', {m: money(g.amount), r: g.receiver}))}</p>
      <p><b>${tr({call: 'guardKindCall', grey: 'guardKindGrey'}[g.kind] || 'guardKindScheme')}</b></p>
      <p>${esc(g.state === 'asked' ? tr('guardAsked', {w: g.ward}) : g.status === 'open' ? tr('guardNotified') : tr('tagReview'))}</p>
      <div class="actions">
        <button class="primary" data-gcancel="${g.case_id}">${tr('guardCancel')}</button>
        ${g.state === 'asked' ? `<button class="soft" data-gconfirm="${g.case_id}">${tr('guardConfirm')}</button>` : ''}
      </div>
    </div>`).join('');
  $('guardAlerts').querySelectorAll('[data-gcancel]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/guardian/requests/${b.dataset.gcancel}/cancel`, {}); note(tr('guardCancelOk'), 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();
  });
  $('guardAlerts').querySelectorAll('[data-gconfirm]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/guardian/requests/${b.dataset.gconfirm}/confirm`, {}); note(tr('guardConfirmOk'), 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();

}

// Настройка доверенного лица. Отключение вступает в силу через сутки.
async function loadGuardian() {
  const forWho = me;
  const g = await api('/guardian').catch(() => null);
  if (!g || forWho !== me) return;
  const box = $('guardianCard');
  let html = `<h2>${tr('guardianH')}</h2><p class="muted">${tr('guardianAbout')}</p>`;
  if (g.guardian) {
    html += `<p><b>${esc(tr('guardianNow', {g: g.guardian.name}))}</b></p>`;
    if (g.guardian.remove_at) {
      const d = new Date(g.guardian.remove_at).toLocaleString(L === 'kk' ? 'kk-KZ' : 'ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
      html += `<div class="note err">${esc(tr('guardianRemoving', {d}))}</div><button class="primary" id="gKeep">${tr('guardianKeep')}</button>`;
    } else html += `<button class="ghost" id="gRemove">${tr('guardianRemove')}</button>`;
  } else if (g.candidates.length) {
    html += `<label for="gPick">${tr('guardianPick')}</label><select id="gPick">${g.candidates.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <button class="primary" id="gSet">${tr('guardianSet')}</button>`;
  } else html += `<p class="muted">${tr('guardianNone')}</p>`;
  box.innerHTML = html;
  const act = async (path, body) => { try { await api(path, body); } catch (e) { note(e.message, 'err'); } loadGuardian(); };
  if ($('gKeep')) $('gKeep').onclick = () => act('/guardian/keep', {});
  if ($('gRemove')) $('gRemove').onclick = () => act('/guardian/remove', {});
  if ($('gSet')) $('gSet').onclick = () => act('/guardian', {guardian_id: +$('gPick').value});
}

// Период охлаждения: свой отложенный перевод и переводы близкого человека, если клиент его доверенное лицо.
let coolTimer = null;
function renderCooling(own, wards) {
  $('coolAlerts').innerHTML = own.map(t => `
    <div class="alert cool">
      <h2>${esc(tr('coolH', {t: hm(t.release_at)}))}</h2>
      <p>${esc(tr('coolText', {m: money(t.amount), r: t.receiver}))}</p>
      <div class="actions"><button class="primary" data-cool="${t.id}">${tr('coolCancel')}</button></div>
    </div>`).join('') + wards.map(t => `
    <div class="alert guard">
      <h2>${esc(tr('guardCoolH', {w: t.sender, m: money(t.amount)}))}</h2>
      <p>${esc(tr('guardCoolText', {r: t.receiver, t: hm(t.release_at)}))}</p>
      <div class="actions"><button class="primary" data-gcool="${t.id}">${tr('coolCancel')}</button></div>
    </div>`).join('');
  const act = (sel, path) => $('coolAlerts').querySelectorAll(sel).forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(path(b), {}); note(tr('coolCancelOk'), 'ok'); } catch (e) { note(e.message, 'err'); }
    load();
  });
  act('[data-cool]', b => `/transfers/${b.dataset.cool}/cancel`);
  act('[data-gcool]', b => `/guardian/transfers/${b.dataset.gcool}/cancel`);
  // Когда срок выйдет, экран обновится сам: перевод уйдёт и карточка исчезнет.
  clearTimeout(coolTimer);
  const next = [...own, ...wards].map(t => new Date(t.release_at) - new Date(serverNow)).sort((a, b) => a - b)[0];
  if (next !== undefined) coolTimer = setTimeout(load, Math.min(Math.max(next, 0) + 1500, 600000));
}

// Проверка подозрительного сообщения: схема, что насторожило и что делать.
$('msgCheck').onclick = async () => {
  $('msgCheck').disabled = true;
  try {
    const r = await api('/messages/check', {text: $('msgText').value});
    let html = `<div class="msgres ${r.verdict}"><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p>`;
    if (r.matched.length) html += `<p>${tr('msgHits')} ${r.matched.map(m => `<span class="hit">${esc(m)}</span>`).join(' ')}</p>`;
    if (r.flags.length) html += `<ul>${r.flags.map(f => `<li>${esc(f.text)}</li>`).join('')}</ul>`;
    if (r.advice.length) html += `<b>${tr('msgDo')}</b><ol>${r.advice.map(a => `<li>${esc(a)}</li>`).join('')}</ol>`;
    if (r.verdict === 'danger') html += `<p style="font-size:14px">${tr('msgWatch')}</p>`;
    if (r.return_incoming) html += `<button class="primary" id="msgReturn">${esc(tr('msgReturn', {m: money(r.return_incoming.amount), who: r.return_incoming.sender}))}</button>`;
    $('msgResult').innerHTML = html + '</div>';
    if (r.return_incoming) $('msgReturn').onclick = async () => {
      $('msgReturn').disabled = true;
      try { const x = await api(`/incoming/${r.return_incoming.id}/return`, {}); note(tr('returnedOk', {m: money(x.amount)}), 'ok'); $('msgResult').innerHTML = ''; }
      catch (e) { note(e.message, 'err'); }
      load();
    };
  } catch (e) { $('msgResult').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  $('msgCheck').disabled = false;
};
document.querySelectorAll('[data-example]').forEach(b => b.onclick = () => {
  $('msgText').value = tr('exText_' + b.dataset.example); $('msgResult').innerHTML = '';
  showTab('safe', 'msgCard');
  $('demoPanel').classList.remove('open');
});

function askReport(btn) {
  const box = document.createElement('div');
  box.className = 'confirm';
  box.innerHTML = `${tr('reportConfirm')}<br>
    <button class="primary">${tr('yesReport')}</button><button class="soft">${tr('cancel')}</button>`;
  btn.replaceWith(box);
  const [yes, no] = box.querySelectorAll('button');
  no.onclick = () => load();
  yes.onclick = async () => {
    yes.disabled = true;
    try { const r = await api(`/transfers/${btn.dataset.report}/complaint`, {}); note(r.text, r.outcome === 'warned' ? 'err' : 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();
  };
}

function showStop(r) {
  held = r;
  // Текст окна зависит от причины: чужие деньги, звонок мошенника или подозрительный получатель.
  $('stopText').textContent = tr({scheme: 'stopText', call: 'stopTextCall', grey: 'stopTextGrey', message: 'stopTextMessage'}[r.kind] || 'stopText');
  $('reasons').innerHTML = r.reasons.map(x => `<li>${esc(x.text)}</li>`).join('');
  $('law').hidden = r.kind !== 'scheme';
  $('ret').hidden = !r.safe_return;
  $('withdraw').hidden = !!r.safe_return;
  if (r.safe_return) $('ret').textContent = tr('ret', {m: money(r.safe_return.amount)});

  $('overlay').classList.add('show');
}

$('withdraw').onclick = async () => {
  $('overlay').classList.remove('show');
  try { await api(`/cases/${held.case_id}/withdraw`, {}); note(tr('withdrawOk'), 'ok'); $('amount').value = ''; }

};

// Проверка получателя по базе Антифрод-центра ещё до нажатия «Перевести».

  const id = $('to').value;
  if (!id) return;

$('callToggle').onclick = async () => {

$('send').onclick = async () => {

};
$('ret').onclick = async () => {
  $('overlay').classList.remove('show');
  try {
    const r = await api(`/cases/${held.case_id}/return-to-sender`, {});
    note(tr('returnedCaseOk', {m: money(r.amount)}), 'ok'); $('amount').value = '';
  } catch (e) { note(e.message, 'err'); }
  load();
};
$('insist').onclick = async () => {
  $('overlay').classList.remove('show');
  try { const r = await api(`/cases/${held.case_id}/insist`, {}); note(r.status === 'guardian' ? r.text : tr('insistOk'), 'err'); }
  catch (e) { note(e.message, 'err'); }
  load();
};
$('later').onclick = () => { $('overlay').classList.remove('show'); load(); };
// При смене клиента сразу убираем экран прежнего: иначе можно успеть нажать кнопку в чужом случае.
function clearScreen() {
  note(''); appeal = null; held = null;
  $('overlay').classList.remove('show');
  $('alerts').innerHTML = ''; $('blockCard').innerHTML = ''; $('blockCard').hidden = true;
  $('feed').innerHTML = ''; $('balance').textContent = '…'; $('heldLine').textContent = '';
  $('recipientNote').innerHTML = ''; $('callAlert').innerHTML = '';
  $('guardAlerts').innerHTML = ''; $('guardianCard').innerHTML = ''; $('certCard').hidden = true;
  $('coolAlerts').innerHTML = ''; $('msgText').value = ''; $('msgResult').innerHTML = ''; clearTimeout(coolTimer);
  $('compCards').innerHTML = ''; $('selfCard').hidden = true; selfKey = ''; selfMsg = '';
}
$('who').onchange = async () => { clearScreen(); showTab('home'); await loginAs(+$('who').value); load(); };
// Язык хранится в cookie: сервер читает его и отвечает на том же языке.
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = async () => {
  L = b.dataset.lang;
  document.cookie = `ca_lang=${L}; path=/; max-age=31536000; samesite=strict`;
  note(''); applyStatic(); await loadPeople(); load();
});

(async () => {
  applyStatic();
  await loadPeople();
  const s = await api('/me').catch(() => null);
  await loginAs(s && s.client ? s.client.client_id : people[0].id);
  load();
})();
</script>
</body>
</html>
