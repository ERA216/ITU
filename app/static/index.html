<!DOCTYPE html>
<html lang="ru" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чистый счёт</title>
<style>
  :root { --bg:#f3f5f4; --card:#fff; --ink:#14201b; --muted:#66736d; --line:#e2e7e4;
          --brand:#0b6b4f; --warn:#b3261e; --warn-bg:#fdecea; --ok:#0b6b4f; --ok-bg:#e6f4ee; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .phone { max-width:420px; margin:0 auto; min-height:100vh; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  header b { font-size:18px; color:var(--brand); }
  select, input, button { font:inherit; }
  select, input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  header select { width:auto; max-width:60%; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; }
  .balance { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); font-size:14px; }
  h2 { font-size:16px; margin:0 0 10px; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  button { border:0; border-radius:12px; padding:12px 14px; font-weight:600; cursor:pointer; width:100%; }
  .primary { background:var(--brand); color:#fff; margin-top:14px; }
  .ghost { background:transparent; color:var(--muted); font-weight:500; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .amt { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  .in { color:var(--ok); }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--line); color:var(--muted); }
  .tag.held { background:var(--warn-bg); color:var(--warn); }
  .note { border-radius:12px; padding:12px; font-size:14px; margin-top:12px; }
  .note.ok { background:var(--ok-bg); color:var(--ok); }
  .note.err { background:var(--warn-bg); color:var(--warn); }
  .overlay { position:fixed; inset:0; background:rgba(20,32,27,.55); display:none; align-items:flex-end; justify-content:center; }
  .overlay.show { display:flex; }
  .sheet { background:#fff; width:100%; max-width:420px; border-radius:20px 20px 0 0; padding:20px 16px 16px; max-height:92vh; overflow:auto; }
  .sheet h2 { font-size:20px; color:var(--warn); }
  .sheet ul { padding-left:20px; margin:10px 0; }
  .sheet li { margin:6px 0; }
  .law { background:var(--warn-bg); border-radius:12px; padding:12px; font-size:14px; margin:12px 0; }
  .blocked h2 { color:var(--warn); font-size:18px; }
  .status { display:inline-block; font-size:13px; font-weight:600; padding:4px 10px; border-radius:99px;
            background:var(--warn-bg); color:var(--warn); margin-bottom:10px; }
  .status.review { background:#fff4d6; color:#7a5200; }
  .status.done { background:var(--ok-bg); color:var(--ok); }
  .doc { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:8px; font-size:14px; }
  .doc b { display:block; font-weight:600; }
  .doc input { border:0; padding:6px 0 0; }
  .doc .have { color:var(--ok); }
  textarea { width:100%; min-height:96px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; resize:vertical; }
  details { margin-top:10px; font-size:14px; }
  summary { cursor:pointer; color:var(--muted); }
  [hidden] { display:none !important; }
  button.link { width:auto; padding:0 4px; background:none; color:var(--brand); font-weight:600; text-decoration:underline; }
  button:disabled { opacity:.6; }
  .alert { background:#fff4d6; color:#5c3d00; border-radius:16px; padding:16px; margin-bottom:12px; }
  .alert.hot { background:var(--warn-bg); color:var(--warn); }
  .alert h2 { color:inherit; font-size:17px; }
  .alert p { margin:6px 0; font-size:15px; }
  .alert .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .alert .actions button { flex:1 1 150px; margin:0; }
  .soft { background:rgba(0,0,0,.06); color:inherit; }
  .tag.warn { background:#fff4d6; color:#7a5200; }
  .confirm { margin-top:6px; font-size:14px; }
  .confirm button { width:auto; padding:6px 10px; font-size:14px; margin-right:6px; }
  .langs { display:flex; gap:2px; background:var(--line); border-radius:8px; padding:2px; }
  .langs button { width:auto; padding:4px 8px; font-size:13px; border-radius:6px; background:none; color:var(--muted); }
  .langs button[aria-pressed="true"] { background:#fff; color:var(--ink); }
  .demo { border:1px dashed var(--line); border-radius:12px; padding:12px; margin-top:4px; }
  .demo button { margin-top:6px; }
  .alert.call { background:var(--warn); color:#fff; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:-4px 0 12px; }
  .alert.guard { background:#e8eefc; color:#1b2f6b; }
  .alert.recruit { background:var(--warn-bg); color:var(--warn); }
  .alert ul { margin:6px 0; padding-left:20px; font-size:14px; }
  .cert { background:var(--ok-bg); color:var(--ok); }
  .cert h2 { color:inherit; }
  a.btn { display:block; text-align:center; text-decoration:none; border-radius:12px; padding:12px 14px; font-weight:600;
          background:var(--brand); color:#fff; margin-top:10px; }
  .guardian select { margin-top:6px; }
  .alert.cool { background:#fff4d6; color:#5c3d00; }
  .msgres { border-radius:12px; padding:12px; margin-top:12px; font-size:15px; }
  .msgres h3 { margin:0 0 6px; font-size:16px; }
  .msgres.danger { background:var(--warn-bg); color:var(--warn); }
  .msgres.caution { background:#fff4d6; color:#5c3d00; }
  .msgres.none { background:var(--ok-bg); color:var(--ok); }
  .msgres ol, .msgres ul { margin:6px 0; padding-left:20px; }
  .msgres .hit { background:rgba(0,0,0,.08); border-radius:6px; padding:0 4px; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { width:auto; padding:6px 10px; font-size:13px; margin:0; }
</style>
</head>
<body>
<div class="phone">
  <header><b data-t="app"></b><select id="who"></select></header>
  <div class="top">
    <a class="muted" href="/analyst" style="color:inherit" data-t="analystLink"></a>
    <div class="langs" role="group" aria-label="Тіл / Язык">
      <button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button>
    </div>
  </div>

  <div class="card">
    <div class="muted" data-t="available"></div>
    <div class="balance" id="balance">…</div>
    <div class="muted" id="heldLine"></div>
  </div>

  <div id="callAlert"></div>
  <div id="coolAlerts"></div>
  <div id="guardAlerts"></div>
  <div id="alerts"></div>
  <div class="card cert" id="certCard" hidden></div>

  <div class="card blocked" id="blockCard" hidden></div>

  <div class="card" id="transferCard">
    <h2 data-t="transferH"></h2>
    <label for="to" data-t="to"></label>
    <select id="to"></select>
    <div id="recipientNote"></div>
    <label for="amount" data-t="amount"></label>
    <input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="0">
    <button class="primary" id="send" data-t="send"></button>
    <div id="note"></div>
  </div>

  <div class="card" id="msgCard">
    <h2 data-t="msgH"></h2>
    <label for="msgText" data-t="msgLabel"></label>
    <textarea id="msgText" maxlength="4000"></textarea>
    <button class="primary" id="msgCheck" data-t="msgCheck"></button>
    <div id="msgResult"></div>
  </div>

  <div class="card">
    <h2 data-t="opsH"></h2>
    <div id="feed"></div>
  </div>

  <div class="card guardian" id="guardianCard"></div>

  <div class="demo">
    <div class="muted" data-t="demoH"></div>
    <button class="soft" id="callToggle"></button>
    <div class="muted" style="margin-top:10px" data-t="demoMsgH"></div>
    <div class="examples">
      <button class="soft" data-example="mistaken" data-t="exMistaken"></button>
      <button class="soft" data-example="safe" data-t="exSafe"></button>
      <button class="soft" data-example="invest" data-t="exInvest"></button>
      <button class="soft" data-example="job" data-t="exJob"></button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="stopTitle">
  <div class="sheet">
    <h2 id="stopTitle" data-t="stopTitle"></h2>
    <p id="stopText"></p>
    <ul id="reasons"></ul>
    <p id="stopGuardian" class="muted"></p>
    <div class="law" id="law" data-t="law"></div>
    <button class="primary" id="ret"></button>
    <button class="primary" id="withdraw" data-t="withdraw"></button>
    <button class="ghost" id="insist" data-t="insist"></button>
    <button class="ghost" id="later" data-t="later"></button>
  </div>
</div>

<script>
// Тексты экрана на русском и казахском. Казахский стоит вычитать носителю языка перед показом.
const T = {
  app: ['Чистый счёт', 'Таза шот'],

const cookieLang = (document.cookie.match(/(?:^|; )ca_lang=(ru|kk)/) || [])[1];
let L = cookieLang || 'ru';
const tr = (key, vars = {}) => T[key][L === 'kk' ? 1 : 0].replace(/\{(\w+)\}/g, (_, k) => vars[k]);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const money = n => Number(n).toLocaleString('ru-RU') + ' ₸';
const hm = s => String(s || '').slice(11, 16);
let people = [], me = null, held = null, appeal = null, serverNow = null;

function applyStatic() {
  document.documentElement.lang = L === 'kk' ? 'kk' : 'ru';
  document.title = tr('app');
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = tr(n.dataset.t));
  $('who').setAttribute('aria-label', tr('who'));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === L)));
}

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(typeof data.detail === 'string' ? data.detail : tr('requestError')); e.status = r.status; throw e; }
  return data;
}
function note(text, kind) { $('note').innerHTML = text ? `<div class="note ${kind}">${esc(text)}</div>` : ''; }

// Демо-вход: выбор персонажа открывает сессию этого клиента на сервере.
async function loginAs(id) {
  await api('/login', {role: 'client', client_id: id});
  me = id; $('who').value = id;
}

async function loadPeople() {
  people = await api('/demo/clients');
  $('who').innerHTML = people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  if (me) $('who').value = me;
}

async function loadBlock() {
  appeal = await api(`/clients/${me}/case`);
  const cls = {under_review:'review', unblocked:'done'}[appeal.status] || '';
  let html = `<span class="status ${cls}">${esc(appeal.status_text)}</span>
    <h2>${tr('blockedH')}</h2>
    <p>${esc(appeal.summary)}</p>
    <details><summary>${tr('whatNoticed')}</summary><ul>${appeal.reasons.map(r => `<li>${esc(r.text)}</li>`).join('')}</ul></details>`;
  if (appeal.status === 'under_review' && appeal.due_at) {
    const d = new Date(appeal.due_at).toLocaleDateString(L === 'kk' ? 'kk-KZ' : 'ru-RU', {day:'numeric', month:'long'});
    html += `<p><b>${esc(tr('due', {d}))}</b> ${tr('dueMore')}</p>`;
  }
  if (appeal.can_submit) {
    html += `<h2 style="color:inherit;margin-top:16px">${tr('needH')}</h2>
      <label for="expl">${tr('explLabel')}</label>
      <textarea id="expl" maxlength="2000" placeholder="${esc(tr('explPh'))}"></textarea>` +
      appeal.required.map(d => `<div class="doc"><b>${esc(d.title)}${d.required ? '' : tr('ifAny')}</b>
        ${d.uploaded ? '<span class="have">' + tr('uploaded') + appeal.documents.filter(x => x.kind === d.kind).map(x => esc(x.filename)).join(', ') + '</span>' : ''}
        <input type="file" accept="image/png,image/jpeg,application/pdf" data-kind="${esc(d.kind)}" aria-label="${esc(d.title)}"></div>`).join('') +
      `<p class="muted">${esc(tr('fileHint', {n: appeal.max_documents}))}</p>
      <button class="primary" id="submitAppeal">${tr('submit')}</button>`;
  } else {
    if (appeal.documents.length) html += `<p class="muted">${esc(tr('youSent', {f: appeal.documents.map(d => d.filename).join(', ')}))}</p>`;
    if (appeal.decision_comment) html += `<div class="note err"><b>${tr('bankAnswer')}</b> ${esc(appeal.decision_comment)}</div>`;
  }
  html += `<div id="blockNote"></div><p class="muted">${tr('antifraudNote')}</p>`;
  const kept = $('expl') ? $('expl').value : '';
  $('blockCard').innerHTML = html;
  if ($('expl')) $('expl').value = kept;
  const bnote = (t, k) => $('blockCard').querySelector('#blockNote').innerHTML = `<div class="note ${k}">${esc(t)}</div>`;
  $('blockCard').querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      if (f.size > 5 * 1024 * 1024) throw new Error(tr('fileTooBig'));
      const b64 = await new Promise((ok, bad) => { const r = new FileReader();
        r.onload = () => ok(r.result.split(',')[1]); r.onerror = bad; r.readAsDataURL(f); });
      await api(`/cases/${appeal.case_id}/documents`, {kind: inp.dataset.kind, filename: f.name, content_base64: b64});
      await loadBlock();
    } catch (e) { bnote(e.message, 'err'); }
  });
  const btn = $('blockCard').querySelector('#submitAppeal');
  if (btn) btn.onclick = async () => {
    try { await api(`/cases/${appeal.case_id}/submit`, {explanation: $('expl').value}); await loadBlock(); }
    catch (e) { bnote(e.message, 'err'); }
  };
}

// Что стало с переводом, который система остановила.
function heldTag(t) {
  if (!t.case_id) return {held: ['held', tr('tagPaused')], cancelled: ['', tr('tagCancelled')],
                          pending: ['warn', tr('tagPending', {t: hm(t.release_at)})]}[t.status] || null;
  return ({
    open: ['held', tr('tagOpen')],
    asked: ['held', tr('tagGuardianWait')],
    under_review: ['held', tr('tagReview')],
    returned: ['', tr('tagReturnedCase')],
    cancelled: ['held', tr('tagCancelledBank')],
    released: ['', tr('tagReleased')],
    withdrawn: ['', tr('tagWithdrawn')],
    guardian_cancelled: ['', tr('tagGuardianCancelled')],
  })[t.case_status === 'open' && t.guardian_state === 'asked' ? 'asked' : t.case_status] || (t.status === 'cancelled' ? ['', tr('tagCancelled')] : null);
}

async function load() {
  let c;
  try { c = await api('/clients/' + me); }
  catch (e) { if (e.status !== 401 && e.status !== 403) throw e; await loginAs(me); c = await api('/clients/' + me); }
  serverNow = c.now;
  $('balance').textContent = money(c.available);
  $('heldLine').textContent = c.held ? tr('heldLine', {m: money(c.held)}) : '';
  renderCall(c.call);
  const blocked = c.status === 'blocked';
  $('blockCard').hidden = !blocked; $('transferCard').hidden = blocked;
  if (blocked) await loadBlock();
  else {
    // Если блокировку только что сняли, говорим об этом клиенту.
    const last = await api(`/clients/${me}/case`).catch(() => null);
    renderCert(last && last.status === 'unblocked' ? last.certificate : null);
    if (last && last.status === 'unblocked' && !(last.certificate && last.certificate.valid) && !$('note').innerHTML)
      note(tr('unblocked'), 'ok');
  }
  if (blocked) renderCert(null);
  renderGuardRequests(c.guardian_requests || []);
  renderCooling(c.cooling || [], c.guardian_cooling || []);
  loadGuardian();
  const chosen = $('to').value;
  $('to').innerHTML = people.filter(p => p.id !== me).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  if (chosen) $('to').value = chosen;
  checkRecipient();
  renderAlerts(blocked ? [] : c.feed, c.recruit);   // пока счёт приостановлен, вернуть деньги самому нельзя
  $('feed').innerHTML = c.feed.map(t => {
    const incoming = t.direction === 'in';
    const title = t.return_of ? tr('returnTitle') : (incoming ? tr('from', {who: t.sender}) : tr('toWho', {who: t.receiver}));
    let tag = incoming ? null : heldTag(t);
    if (incoming && t.warning) tag = ['warn', tr('tagMaybeForeign')];
    if (incoming && t.returned) tag = ['', tr('tagReturnedIn')];
    if (!incoming && t.complained) tag = ['warn', tr('tagReported')];
    const open = !incoming && t.case_status === 'open' ? ` <button class="link" data-case="${t.case_id}">${tr('decide')}</button>` : '';
    const answer = !incoming && t.decision_comment ? `<div class="muted">${tr('bankAnswer')} ${esc(t.decision_comment)}</div>` : '';
    const report = !incoming && t.can_complain && !t.complained
      ? `<div><button class="link" data-report="${t.id}" style="padding:0;font-weight:500;color:var(--muted)">${tr('reportQ')}</button></div>` : '';
    return `<div class="row"><div>${esc(title)} ${tag ? `<span class="tag ${tag[0]}">${esc(tag[1])}</span>` : ''}${open}
            <div class="muted">${esc(t.created_at.replace('T',' ').slice(0,16))}</div>${answer}${report}</div>
            <div class="amt ${incoming ? 'in' : ''}">${incoming ? '+' : '−'}${money(t.amount)}</div></div>`;
  }).join('') || `<div class="muted">${tr('noOps')}</div>`;
  $('feed').querySelectorAll('button[data-case]').forEach(b => b.onclick = async () => showStop(await api('/cases/' + b.dataset.case)));
  $('feed').querySelectorAll('button[data-report]').forEach(b => b.onclick = () => askReport(b));
}

// Предупреждение приходит вместе с деньгами, а не в момент, когда мошенник уже просит их переслать.
function renderAlerts(feed, recruit) {
  // Если похоже на вербовку, показываем одну общую карточку вместо предупреждения по каждому переводу.
  const skip = new Set(recruit ? recruit.incoming_ids : []);
  const items = feed.filter(t => t.direction === 'in' && t.warning && !skip.has(t.id));
  $('alerts').innerHTML = (recruit ? `
    <div class="alert recruit">
      <h2>${tr('recruitH')}</h2>
      <p>${esc(tr('recruitText', {n: recruit.senders, m: money(recruit.amount)}))}</p>
      <p>${tr('recruitScheme')}</p>
      <div class="actions">
        <button class="primary" id="recruitReturn">${esc(tr('recruitReturn', {m: money(recruit.amount)}))}</button>
        <button class="soft" id="recruitKnown">${tr('recruitKnown')}</button>
      </div>
      <p style="font-size:14px">${tr('recruitAfter')}</p>
    </div>` : '') + items.map(t => `
    <div class="alert ${t.complained ? 'hot' : ''}">
      <h2>${tr(t.complained ? 'alertHotH' : 'alertH')}</h2>
      <p>${esc(tr('alertFrom', {m: money(t.amount), who: t.sender}))} ${tr(t.complained ? 'alertHot' : 'alertNew')}</p>
      ${t.complained ? '' : `<p>${tr('alertScheme')}</p>`}
      <div class="actions">
        <button class="primary" data-return="${t.id}">${esc(tr('ret', {m: money(t.amount)}))}</button>
        ${t.complained ? '' : `<button class="soft" data-known="${t.id}">${tr('known')}</button>`}
      </div>
    </div>`).join('');
  $('alerts').querySelectorAll('[data-return]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await api(`/incoming/${b.dataset.return}/return`, {}); note(tr('returnedOk', {m: money(r.amount)}), 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();
  });
  if (recruit) {
    $('recruitReturn').onclick = async () => {
      $('recruitReturn').disabled = true;
      try { const r = await api('/recruit/return-all', {}); note(tr('recruitReturned', {m: money(r.amount)}), 'ok'); }
      catch (e) { note(e.message, 'err'); }
      load();
    };
    $('recruitKnown').onclick = async () => {
      try { await api('/recruit/dismiss', {}); note(tr('recruitKnownOk'), 'ok'); } catch (e) { note(e.message, 'err'); }
      load();
    };
  }
  $('alerts').querySelectorAll('[data-known]').forEach(b => b.onclick = async () => {
    await api(`/incoming/${b.dataset.known}/known`, {}).catch(e => note(e.message, 'err'));
    note(tr('knownOk'), 'ok');
    load();
  });
}

// Справка о снятии ограничений: её можно открыть, распечатать и показать в другом банке.
function renderCert(cert) {
  $('certCard').hidden = !(cert && cert.valid);
  if (!cert || !cert.valid) return;
  $('certCard').innerHTML = `<h2>${tr('certH')}</h2><p>${esc(tr('certText', {n: cert.number, c: cert.code}))}</p>
    <a class="btn" href="/clients/${me}/certificate" target="_blank" rel="noopener">${tr('certOpen')}</a>`;
}

// Экран доверенного лица: остановленные переводы близкого человека.
function renderGuardRequests(items) {
  $('guardAlerts').innerHTML = items.map(g => `
    <div class="alert guard">
      <h2>${esc(tr('guardH', {w: g.ward}))}</h2>
      <p>${esc(tr('guardText', {m: money(g.amount), r: g.receiver}))}</p>
      <p><b>${tr({call: 'guardKindCall', grey: 'guardKindGrey'}[g.kind] || 'guardKindScheme')}</b></p>
      <p>${esc(g.state === 'asked' ? tr('guardAsked', {w: g.ward}) : g.status === 'open' ? tr('guardNotified') : tr('tagReview'))}</p>
      <div class="actions">
        <button class="primary" data-gcancel="${g.case_id}">${tr('guardCancel')}</button>
        ${g.state === 'asked' ? `<button class="soft" data-gconfirm="${g.case_id}">${tr('guardConfirm')}</button>` : ''}
      </div>
    </div>`).join('');
  $('guardAlerts').querySelectorAll('[data-gcancel]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/guardian/requests/${b.dataset.gcancel}/cancel`, {}); note(tr('guardCancelOk'), 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();
  });
  $('guardAlerts').querySelectorAll('[data-gconfirm]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/guardian/requests/${b.dataset.gconfirm}/confirm`, {}); note(tr('guardConfirmOk'), 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();
  });
}

// Настройка доверенного лица. Отключение вступает в силу через сутки.
async function loadGuardian() {
  const forWho = me;
  const g = await api('/guardian').catch(() => null);
  if (!g || forWho !== me) return;
  const box = $('guardianCard');
  let html = `<h2>${tr('guardianH')}</h2><p class="muted">${tr('guardianAbout')}</p>`;
  if (g.guardian) {
    html += `<p><b>${esc(tr('guardianNow', {g: g.guardian.name}))}</b></p>`;
    if (g.guardian.remove_at) {
      const d = new Date(g.guardian.remove_at).toLocaleString(L === 'kk' ? 'kk-KZ' : 'ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
      html += `<div class="note err">${esc(tr('guardianRemoving', {d}))}</div><button class="primary" id="gKeep">${tr('guardianKeep')}</button>`;
    } else html += `<button class="ghost" id="gRemove">${tr('guardianRemove')}</button>`;
  } else if (g.candidates.length) {
    html += `<label for="gPick">${tr('guardianPick')}</label><select id="gPick">${g.candidates.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <button class="primary" id="gSet">${tr('guardianSet')}</button>`;
  } else html += `<p class="muted">${tr('guardianNone')}</p>`;
  box.innerHTML = html;
  const act = async (path, body) => { try { await api(path, body); } catch (e) { note(e.message, 'err'); } loadGuardian(); };
  if ($('gKeep')) $('gKeep').onclick = () => act('/guardian/keep', {});
  if ($('gRemove')) $('gRemove').onclick = () => act('/guardian/remove', {});
  if ($('gSet')) $('gSet').onclick = () => act('/guardian', {guardian_id: +$('gPick').value});
}

// Период охлаждения: свой отложенный перевод и переводы близкого человека, если клиент его доверенное лицо.
let coolTimer = null;
function renderCooling(own, wards) {
  $('coolAlerts').innerHTML = own.map(t => `
    <div class="alert cool">
      <h2>${esc(tr('coolH', {t: hm(t.release_at)}))}</h2>
      <p>${esc(tr('coolText', {m: money(t.amount), r: t.receiver}))}</p>
      <div class="actions"><button class="primary" data-cool="${t.id}">${tr('coolCancel')}</button></div>
    </div>`).join('') + wards.map(t => `
    <div class="alert guard">
      <h2>${esc(tr('guardCoolH', {w: t.sender, m: money(t.amount)}))}</h2>
      <p>${esc(tr('guardCoolText', {r: t.receiver, t: hm(t.release_at)}))}</p>
      <div class="actions"><button class="primary" data-gcool="${t.id}">${tr('coolCancel')}</button></div>
    </div>`).join('');
  const act = (sel, path) => $('coolAlerts').querySelectorAll(sel).forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api(path(b), {}); note(tr('coolCancelOk'), 'ok'); } catch (e) { note(e.message, 'err'); }
    load();
  });
  act('[data-cool]', b => `/transfers/${b.dataset.cool}/cancel`);
  act('[data-gcool]', b => `/guardian/transfers/${b.dataset.gcool}/cancel`);
  // Когда срок выйдет, экран обновится сам: перевод уйдёт и карточка исчезнет.
  clearTimeout(coolTimer);
  const next = [...own, ...wards].map(t => new Date(t.release_at) - new Date(serverNow)).sort((a, b) => a - b)[0];
  if (next !== undefined) coolTimer = setTimeout(load, Math.min(Math.max(next, 0) + 1500, 600000));
}

// Проверка подозрительного сообщения: схема, что насторожило и что делать.
$('msgCheck').onclick = async () => {
  $('msgCheck').disabled = true;
  try {
    const r = await api('/messages/check', {text: $('msgText').value});
    let html = `<div class="msgres ${r.verdict}"><h3>${esc(r.title)}</h3><p>${esc(r.text)}</p>`;
    if (r.matched.length) html += `<p>${tr('msgHits')} ${r.matched.map(m => `<span class="hit">${esc(m)}</span>`).join(' ')}</p>`;
    if (r.flags.length) html += `<ul>${r.flags.map(f => `<li>${esc(f.text)}</li>`).join('')}</ul>`;
    if (r.advice.length) html += `<b>${tr('msgDo')}</b><ol>${r.advice.map(a => `<li>${esc(a)}</li>`).join('')}</ol>`;
    if (r.verdict === 'danger') html += `<p style="font-size:14px">${tr('msgWatch')}</p>`;
    if (r.return_incoming) html += `<button class="primary" id="msgReturn">${esc(tr('msgReturn', {m: money(r.return_incoming.amount), who: r.return_incoming.sender}))}</button>`;
    $('msgResult').innerHTML = html + '</div>';
    if (r.return_incoming) $('msgReturn').onclick = async () => {
      $('msgReturn').disabled = true;
      try { const x = await api(`/incoming/${r.return_incoming.id}/return`, {}); note(tr('returnedOk', {m: money(x.amount)}), 'ok'); $('msgResult').innerHTML = ''; }
      catch (e) { note(e.message, 'err'); }
      load();
    };
  } catch (e) { $('msgResult').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  $('msgCheck').disabled = false;
};
document.querySelectorAll('[data-example]').forEach(b => b.onclick = () => {
  $('msgText').value = tr('exText_' + b.dataset.example); $('msgResult').innerHTML = '';
  $('msgCard').scrollIntoView({behavior: 'smooth', block: 'start'});
});

function askReport(btn) {
  const box = document.createElement('div');
  box.className = 'confirm';
  box.innerHTML = `${tr('reportConfirm')}<br>
    <button class="primary">${tr('yesReport')}</button><button class="soft">${tr('cancel')}</button>`;
  btn.replaceWith(box);
  const [yes, no] = box.querySelectorAll('button');
  no.onclick = () => load();
  yes.onclick = async () => {
    yes.disabled = true;
    try { const r = await api(`/transfers/${btn.dataset.report}/complaint`, {}); note(r.text, r.outcome === 'warned' ? 'err' : 'ok'); }
    catch (e) { note(e.message, 'err'); }
    load();
  };
}

function showStop(r) {
  held = r;
  // Текст окна зависит от причины: чужие деньги, звонок мошенника или подозрительный получатель.
  $('stopText').textContent = tr({scheme: 'stopText', call: 'stopTextCall', grey: 'stopTextGrey', message: 'stopTextMessage'}[r.kind] || 'stopText');
  $('reasons').innerHTML = r.reasons.map(x => `<li>${esc(x.text)}</li>`).join('');
  $('law').hidden = r.kind !== 'scheme';
  $('ret').hidden = !r.safe_return;
  $('withdraw').hidden = !!r.safe_return;
  if (r.safe_return) $('ret').textContent = tr('ret', {m: money(r.safe_return.amount)});
  $('stopGuardian').textContent = r.guardian ? tr('stopGuardian', {g: r.guardian}) : '';
  $('overlay').classList.add('show');
}

$('withdraw').onclick = async () => {
  $('overlay').classList.remove('show');
  try { await api(`/cases/${held.case_id}/withdraw`, {}); note(tr('withdrawOk'), 'ok'); $('amount').value = ''; }
  catch (e) { note(e.message, 'err'); }
  load();
};

// Проверка получателя по базе Антифрод-центра ещё до нажатия «Перевести».
async function checkRecipient() {
  const id = $('to').value;
  if (!id) return;
  const r = await api(`/recipients/${id}/check`).catch(() => null);
  if ($('to').value !== id) return;
  $('recipientNote').innerHTML = r && r.text ? `<div class="note err">${esc(r.text)}</div>` : '';
}
$('to').onchange = checkRecipient;

let callOn = false;
function renderCall(call) {
  callOn = !!call;
  $('callAlert').innerHTML = call ? `<div class="alert call"><h2>${tr('callH')}</h2><p>${esc(tr('callText', {n: call.number}))}</p></div>` : '';
  $('callToggle').textContent = tr(callOn ? 'demoCallOff' : 'demoCallOn');
}
$('callToggle').onclick = async () => {
  const r = await api('/telecom/signal', {active: !callOn}).catch(e => { note(e.message, 'err'); return undefined; });
  if (r !== undefined) renderCall(r);
};

$('send').onclick = async () => {
  note(''); $('send').disabled = true;
  try {
    const r = await api('/transfers', {receiver_id: +$('to').value, amount: Math.floor(+$('amount').value)});
    if (r.status === 'held') showStop(r);
    else if (r.status === 'pending') { note(tr('coolSent', {t: hm(r.release_at)}), 'err'); $('amount').value = ''; }
    else { note(tr('done'), 'ok'); $('amount').value = ''; }
  } catch (e) { note(e.message, 'err'); }
  $('send').disabled = false; load();
};
$('ret').onclick = async () => {
  $('overlay').classList.remove('show');
  try {
    const r = await api(`/cases/${held.case_id}/return-to-sender`, {});
    note(tr('returnedCaseOk', {m: money(r.amount)}), 'ok'); $('amount').value = '';
  } catch (e) { note(e.message, 'err'); }
  load();
};
$('insist').onclick = async () => {
  $('overlay').classList.remove('show');
  try { const r = await api(`/cases/${held.case_id}/insist`, {}); note(r.status === 'guardian' ? r.text : tr('insistOk'), 'err'); }
  catch (e) { note(e.message, 'err'); }
  load();
};
$('later').onclick = () => { $('overlay').classList.remove('show'); load(); };
// При смене клиента сразу убираем экран прежнего: иначе можно успеть нажать кнопку в чужом случае.
function clearScreen() {
  note(''); appeal = null; held = null;
  $('overlay').classList.remove('show');
  $('alerts').innerHTML = ''; $('blockCard').innerHTML = ''; $('blockCard').hidden = true;
  $('feed').innerHTML = ''; $('balance').textContent = '…'; $('heldLine').textContent = '';
  $('recipientNote').innerHTML = ''; $('callAlert').innerHTML = '';
  $('guardAlerts').innerHTML = ''; $('guardianCard').innerHTML = ''; $('certCard').hidden = true;
  $('coolAlerts').innerHTML = ''; $('msgText').value = ''; $('msgResult').innerHTML = ''; clearTimeout(coolTimer);
}
$('who').onchange = async () => { clearScreen(); await loginAs(+$('who').value); load(); };
// Язык хранится в cookie: сервер читает его и отвечает на том же языке.
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = async () => {
  L = b.dataset.lang;
  document.cookie = `ca_lang=${L}; path=/; max-age=31536000; samesite=strict`;
  note(''); applyStatic(); await loadPeople(); load();
});

(async () => {
  applyStatic();
  await loadPeople();
  const s = await api('/me').catch(() => null);
  await loginAs(s && s.client ? s.client.client_id : people[0].id);
  load();
})();
</script>
</body>
</html>
